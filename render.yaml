# Render Blueprint: one free web service built from the Dockerfile.
# The app is public. To require a password, add the environment variable
# BIM7D_ACCESS_PASSWORD in the Render dashboard (never store it in this repository).
services:
  - type: web
    name: bim7d-kifisia
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
